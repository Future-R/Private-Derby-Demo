    <title>私密马赛 Private Derby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
      body {
        font-family: 'Noto Sans SC', sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        overflow: hidden;
      }
      /* Custom scrollbar for commentary */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      #error-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.98);
        z-index: 99999;
        padding: 2rem;
        box-sizing: border-box;
        font-family: monospace;
      }
    </style>
    <!-- Error Handler: Captures loading errors (404s) and runtime errors -->
    <script>
      window.addEventListener('error', function(e) {
        var overlay = document.getElementById('error-overlay');
        if (!overlay) {
             overlay = document.createElement('div');
             overlay.id = 'error-overlay';
             document.body.appendChild(overlay);
        }
        overlay.style.display = 'block';
        
        var msg = e.message;
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            msg = 'Failed to load resource: ' + (e.target.src || e.target.href);
        }
        
        overlay.innerHTML += '<div style="color:red; border-bottom:1px solid #ccc; padding:10px; margin-bottom:10px;">' +
                             '<strong>Error:</strong> ' + msg + '<br>' +
                             '<small>' + (e.filename || 'Unknown Source') + ':' + (e.lineno || 0) + '</small>' +
                             '</div>';
      }, true);
    </script>
